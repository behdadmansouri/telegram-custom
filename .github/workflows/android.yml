name: android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'desktop/purple.py', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write      # the Release on main, fast-forwarding main
      issues: write        # a failed upstream bump opens one
      id-token: write      # build provenance (Sigstore)
      attestations: write
    steps:
      # The native build (ffmpeg, boringssl, ...) outgrows the runner's ~14 GB
      # free disk; drop preinstalled toolchains we never use (keeps the Android SDK).
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/node_modules /opt/microsoft /opt/google
          sudo docker image prune -af > /dev/null || true
          df -h /

      - uses: actions/checkout@v4
        with:
          path: custom
          fetch-depth: 0     # announce.sh: changelog since the previous release

      - name: Patch lint
        run: bash custom/.github/patch-lint.sh

      - name: Pin upstream
        run: echo "UPSTREAM_REF=$(grep -v '^#' custom/android/UPSTREAM | head -1)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: DrKLO/Telegram
          ref: ${{ env.UPSTREAM_REF }}
          path: tg
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK + NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
          nproc; free -g

      - name: Icon deps
        run: python3 -c 'import PIL, numpy' 2>/dev/null || python3 -m pip install --user --break-system-packages pillow numpy

      - name: Customize
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash custom/android/customize.sh tg

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ env.UPSTREAM_REF }}

      - name: Build
        working-directory: tg
        run: ./gradlew --no-daemon :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Disk after build
        if: always()
        run: df -h /

      - name: Name the APK
        run: |
          ver=$(sed -n 's/^APP_VERSION_NAME=//p' tg/gradle.properties)
          echo "APP_VERSION=$ver" >> "$GITHUB_ENV"
          mkdir out
          cp tg/TMessagesProj_App/build/outputs/apk/afat/release/*.apk "out/TG-Custom-$ver-arm64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tg-custom-android-${{ env.UPSTREAM_REF }}
          path: out/*.apk
          retention-days: 30

      # An upstream bump that built green becomes main before it is released.
      - name: Fast-forward main
        if: startsWith(github.ref, 'refs/heads/upstream/')
        working-directory: custom
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            # main moved on meanwhile: replay the one-line pin bump on top,
            # unless main's new commits change what this build was made from
            if ! git diff --quiet HEAD...origin/main -- android desktop/purple.py .github/workflows/android.yml; then
              echo "::error::main changed this platform's sources during the build; rerun on a fresh bump"; exit 1
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase -q origin/main
          fi
          git push origin "HEAD:refs/heads/main"
          git push origin --delete "${GITHUB_REF#refs/heads/}"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/attest@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upstream/')
        with:
          subject-path: out/*.apk

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upstream/')
        working-directory: custom
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/release.sh android "$APP_VERSION" "DrKLO/Telegram@${UPSTREAM_REF:0:8}" ../out/*.apk

      # Skips with a notice while the two secrets are unset (see USAGE.md).
      - name: Announce on Telegram
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upstream/')
        working-directory: custom
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: .github/announce.sh android "$RELEASE_TAG" ../out/*.apk

      - name: Report a failed upstream bump
        if: failure() && startsWith(github.ref, 'refs/heads/upstream/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          command -v gh > /dev/null || pacman -S --noconfirm --needed github-cli > /dev/null
          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs -q '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")')
          gh issue create --title "${GITHUB_REF#refs/heads/}: build failed (${failed:-see run})" \
            --body "The automatic upstream bump did not build, so nothing was released and main is unchanged. Failed step: ${failed:-unknown}. A patch that no longer applies shows up in **Customize** (Android) or **Build** (desktop). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix it on the branch and rerun the workflow there, or delete the branch to let the next bump through."
