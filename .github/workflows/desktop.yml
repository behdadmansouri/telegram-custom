name: desktop

# Builds in a Manjaro container against Manjaro stable's own libs, so the
# binary runs on an up-to-date Manjaro stable machine. The only place desktop
# is built. Install or update on the laptop with: desktop/install.sh --release

on:
  workflow_dispatch:
  push:
    branches: [main]
    # the laptop-side scripts don't change the app
    paths: ['desktop/**', '!desktop/install.sh', '!desktop/auto-update.sh', '.github/workflows/desktop.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container: manjarolinux/base:latest
    permissions:
      contents: write      # the Release on main, fast-forwarding main
      issues: write        # a failed upstream bump opens one
      id-token: write      # build provenance (Sigstore)
      attestations: write
    env:
      CI: 'true'
      TG_CUSTOM_CACHE: /tmp/tgc
      CCACHE_DIR: /tmp/ccache
      # tdesktop uses precompiled headers; ccache needs these to hit.
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
      CCACHE_MAXSIZE: 3G
    steps:
      - name: Toolchain + libs
        run: |
          pacman-key --init > /dev/null
          pacman-key --populate archlinux manjaro > /dev/null
          pacman -Sy --noconfirm --needed archlinux-keyring manjaro-keyring > /dev/null
          pacman-mirrors --get-branch || true
          # runtime + build deps from the Arch PKGBUILD at the pinned tag
          pacman -Syu --noconfirm --needed base-devel ccache python-pillow python-numpy \
            abseil-cpp ada ffmpeg glib2 hunspell kcoreaddons libavif libfido2 libheif \
            libjpeg-turbo libjxl libpipewire libsrtp libxcb libxcomposite libxdamage \
            libxext libxfixes libxkbcommon libxrandr libxtst lz4 minizip openal openh264 \
            openssl pipewire qt6-base qt6-imageformats qt6-svg qt6-wayland rnnoise xxhash \
            zlib boost boost-libs cmake git glib2-devel gobject-introspection \
            qt6-shadertools gperf libtg_owt microsoft-gsl ninja python range-v3 \
            tl-expected vulkan-headers > /dev/null
          pacman -Q qt6-base ffmpeg libtg_owt
          nproc; free -g; df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # announce.sh: changelog since the previous release

      - name: Patch lint
        run: bash .github/patch-lint.sh

      # Trust model guard (docs/trust.md 4.1, C1/C2): upstream calling a gated
      # media function from a new file, or dropping a hooked one, fails here
      # before the long build; then the rule table's unit test.
      - name: Media caller guard + trust rule tests
        run: |
          git config --global --add safe.directory '*'
          desktop/build.sh --tree
          source desktop/UPSTREAM
          tree=$TG_CUSTOM_CACHE/src/tdesktop-$TDESKTOP_VERSION-full
          bash .github/media-callers.sh check desktop "$tree" upstream
          g++ -std=c++20 -Wall -Wextra -Werror -I "$tree/Telegram/SourceFiles" \
            desktop/tests/trust_rules_test.cpp -o /tmp/trust_rules_test
          /tmp/trust_rules_test

      - uses: actions/cache@v4
        with:
          path: /tmp/ccache
          key: ccache-${{ hashFiles('desktop/UPSTREAM') }}-${{ github.sha }}
          restore-keys: ccache-${{ hashFiles('desktop/UPSTREAM') }}-

      - name: Build
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          git config --global --add safe.directory '*'
          KEEP_GOING=1 JOBS=$(nproc) desktop/build.sh
          ccache -s | head -8

      - name: Package
        run: |
          source desktop/UPSTREAM
          echo "APP_VERSION=$TDESKTOP_VERSION" >> "$GITHUB_ENV"
          tar -C /tmp/tgc/stage -czf telegram-custom.tar.gz .
          mkdir out
          cp telegram-custom.tar.gz "out/Telegram-Custom-$TDESKTOP_VERSION-manjaro-x86_64.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-custom-desktop
          path: telegram-custom.tar.gz
          retention-days: 30

      # An upstream bump that built green becomes main before it is released.
      - name: Fast-forward main
        if: startsWith(github.ref, 'refs/heads/upstream/')
        run: |
          git fetch -q origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            # main moved on meanwhile: replay the one-line pin bump on top,
            # unless main's new commits change what this build was made from
            if ! git diff --quiet HEAD...origin/main -- desktop .github/workflows/desktop.yml; then
              echo "::error::main changed this platform's sources during the build; rerun on a fresh bump"; exit 1
            fi
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' rebase -q origin/main
          fi
          git push origin "HEAD:refs/heads/main"
          git push origin --delete "${GITHUB_REF#refs/heads/}"
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/attest@v4
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upstream/')
        with:
          subject-path: out/*.tar.gz

      - name: Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upstream/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          command -v gh > /dev/null || pacman -S --noconfirm --needed github-cli > /dev/null
          .github/release.sh desktop "$APP_VERSION" "tdesktop v$APP_VERSION" out/*.tar.gz

      # Skips with a notice while the two secrets are unset (see USAGE.md).
      - name: Announce on Telegram
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/upstream/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: .github/announce.sh desktop "$RELEASE_TAG" out/*.tar.gz

      - name: Report a failed upstream bump
        if: failure() && startsWith(github.ref, 'refs/heads/upstream/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          command -v gh > /dev/null || pacman -S --noconfirm --needed github-cli > /dev/null
          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs -q '[.jobs[].steps[] | select(.conclusion == "failure") | .name] | join(", ")')
          gh issue create --title "${GITHUB_REF#refs/heads/}: build failed (${failed:-see run})" \
            --body "The automatic upstream bump did not build, so nothing was released and main is unchanged. Failed step: ${failed:-unknown}. A patch that no longer applies shows up in **Customize** (Android) or **Build** (desktop). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Fix it on the branch and rerun the workflow there, or delete the branch to let the next bump through."
